[component.weather]
description = "Autonomous weather brain: drifting sky states, wind, and the sea's slow answer (scripts/weather.rhai)"

# The F3 panel (Flint #744): each field's `panel` says what it is on it, status, tune or trigger.
[component.weather.fields]
enabled = { type = "bool", description = "false = weather stands down (hand-tune the ocean freely)", default = true }
forced_state = { type = "f32", description = "-1 = autonomous drift; 0..4 forces Clear/Scattered/Overcast/Rain/Storm (eased)", default = -1.0, panel = { role = "tune", label = "Force state", unset = -1.0, from = "state", labels = ["Clear", "Scattered", "Overcast", "Rain", "Storm"] } }
snap = { type = "bool", description = "One-shot: jump state, wind, and sea to the target instantly (panel sets; script clears)", default = false, panel = { role = "trigger", label = "Snap" } }
strike_now = { type = "bool", description = "One-shot: fire a lightning strike immediately (panel sets; script clears)", default = false, panel = { role = "trigger", label = "Strike now" } }
state = { type = "f32", description = "PUBLISHED continuous weather state 0..4 (script-owned; read-only elsewhere)", default = 1.0, panel = { role = "status", labels = ["Clear", "Scattered", "Overcast", "Rain", "Storm"] } }
wind = { type = "f32", description = "PUBLISHED current wind incl. gusts, m/s (script-owned)", default = 4.0, panel = { role = "status", format = "wind {:.1} m/s" } }
sea = { type = "f32", description = "PUBLISHED normalized sea energy 0..1 — the slow swell state (script-owned)", default = 0.25, panel = { role = "status", format = "sea {:.0}%", scale = 100.0 } }
fog_mul = { type = "f32", description = "PUBLISHED fog density multiplier — applied by time_of_day.rhai", default = 1.0 }
fog_gray = { type = "f32", description = "PUBLISHED 0..1 fog desaturation toward storm gray — applied by time_of_day.rhai", default = 0.0 }
sun_scale = { type = "f32", description = "PUBLISHED sun intensity multiplier (overcast dimming) — applied by time_of_day.rhai", default = 1.0 }
amb_scale = { type = "f32", description = "PUBLISHED hemisphere ambient multiplier — applied by time_of_day.rhai", default = 1.0 }
star_scale = { type = "f32", description = "PUBLISHED star opacity multiplier (clouds hide stars) — applied by time_of_day.rhai", default = 1.0 }
tint_mul = { type = "f32", description = "PUBLISHED cloud_tint rgb multiplier (storm-dark clouds) — applied by time_of_day.rhai", default = 1.0 }
tint_alpha = { type = "f32", description = "PUBLISHED cloud_tint alpha floor 0..1 — applied by time_of_day.rhai", default = 0.0 }
ocean_dark = { type = "f32", description = "PUBLISHED ocean palette multiplier (gray-green storm sea) — applied by time_of_day.rhai", default = 1.0 }
flash = { type = "f32", description = "PUBLISHED lightning flash 0..1 this frame — applied by time_of_day.rhai (sun/cloud whiteout)", default = 0.0 }
transition_s = { type = "f32", description = "Seconds for the sky to cross one whole state step", default = 60.0, panel = { role = "tune", label = "Transition (s)", min = 1.0, max = 600.0, step = 1.0 } }
wind_tau_s = { type = "f32", description = "Wind response time constant (s) — wind chases the sky", default = 20.0, panel = { role = "tune", label = "Wind tau (s)", min = 0.5, max = 300.0, step = 0.5 } }
sea_build_tau_s = { type = "f32", description = "Sea build time constant (s) — the swell chases the wind, slowly", default = 120.0, panel = { role = "tune", label = "Sea build tau (s)", min = 1.0, max = 1800.0, step = 1.0 } }
sea_decay_tau_s = { type = "f32", description = "Sea decay time constant (s) — the dying swell outlives the storm", default = 240.0, panel = { role = "tune", label = "Sea decay tau (s)", min = 1.0, max = 1800.0, step = 1.0 } }
gust_strength = { type = "f32", description = "Gust depth as a fraction of mean wind (scales with state)", default = 0.15, panel = { role = "tune", label = "Gust strength", min = 0.0, max = 1.0, step = 0.005 } }
amp_storm = { type = "f32", description = "Storm amplitude ceiling (m, total crest budget) — the single drama dial", default = 5.5, panel = { role = "tune", label = "Storm amplitude", min = 0.5, max = 10.0, step = 0.05 } }
rain_rate_max = { type = "f32", description = "Rain emitter particles/sec at full storm", default = 4000.0, panel = { role = "tune", label = "Rain rate max", min = 0.0, max = 10000.0, step = 25.0 } }
strike_min_s = { type = "f32", description = "Minimum seconds between lightning strikes in a storm", default = 6.0 }
strike_max_s = { type = "f32", description = "Maximum seconds between lightning strikes in a storm", default = 25.0 }
near_strike_chance = { type = "f32", description = "Chance a strike rolls near (150-400 m) instead of far (500-3000 m)", default = 0.2 }
raft_assist = { type = "f32", description = "Scales the storm boost to raft heave/angular response (0 = raw calm-sea inertia)", default = 1.0, panel = { role = "tune", label = "Raft assist", min = 0.0, max = 3.0, step = 0.02 } }
debug_log = { type = "bool", description = "Print the cascade (state/wind/sea → amplitude) once a second", default = false }
