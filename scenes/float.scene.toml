# ================================================================
#  FLOAT — adrift
# ================================================================
#
#  You sit on a hand-lashed raft on an endless ocean. That's it.
#  That's the game.
#
#  Launch: play.bat
#
#  Controls:
#    Mouse / Arrows / Right stick — look around
#    Escape                       — exit
#
#  M0: static raft on a flat placeholder slab. The real ocean
#  arrives with the M1 ocean pipeline.
# ================================================================

[scene]
name = "Float — adrift"
version = "0.1"
description = "First-person raft on an endless stylized ocean"
input_config = "config/input.toml"

[post_process]
enabled = true
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.0
vignette_enabled = true
vignette = 0.18
fog_enabled = true
fog_color = [0.70, 0.82, 0.92]
fog_density = 0.0015
fog_start = 60.0

# ── Light: late-morning sun (M3 animates this via time_of_day.rhai) ──

# Note: Flint's light `direction` points FROM surfaces TOWARD the light
# (shadow eye sits along +direction; PBR uses L = normalize(direction)).
# Direction/color/intensity are driven per-frame by time_of_day.rhai.
[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.35, 0.75, -0.45]
color = [1.0, 0.96, 0.86]
intensity = 1.5

# ── Procedural sky (replaces the texture skybox; sun disc follows the
#    sun light). Fields driven per-frame by time_of_day.rhai. ──────

[entities.sky_dome]
[entities.sky_dome.sky]
zenith_color = [0.10, 0.32, 0.70, 1.0]
horizon_color = [0.55, 0.75, 0.90, 1.0]
haze_color = [0.80, 0.88, 0.95, 0.55]
cloud_tint = [1.0, 1.0, 1.0, 0.85]
sun_disc_size = 0.035
sun_glow = 1.0
star_opacity = 0.0
cloud_coverage = 0.38
cloud_density = 0.22
cloud_scale = 0.9
cloud_drift_x = 0.004
cloud_drift_y = 0.0015

# ── Time of day: one continuous 0-24h parameter driving sun, sky,
#    fog, ambient, and the ocean palette ───────────────────────────

[entities.tod]
[entities.tod.time_of_day]
time_hours = 10.5
day_length_sec = 600.0
auto_advance = true
sun_path_tilt_deg = 28.0
[entities.tod.script]
source = "time_of_day.rhai"

# ── The ocean ────────────────────────────────────────────────────

[entities.ocean]
[entities.ocean.ocean]
seed = 7
num_waves = 12
wavelength_min = 5.0
wavelength_max = 70.0
amplitude = 2.0
choppiness = 0.8199999928474426
direction_deg = 155.0
spread_deg = 40.0
speed_scale = 1.0
wind_speed = 4.0
fetch_km = 60.0
peak_enhancement = 3.299999952316284
deep_color = [0.01600000075995922, 0.14000000059604645, 0.5, 1.0]
shallow_color = [0.10000000149011612, 0.46000000834465027, 0.8500000238418579, 1.0]
foam_color = [0.9700000286102295, 0.9900000095367432, 1.0, 1.0]
sss_color = [0.05000000074505806, 0.44999998807907104, 0.5, 1.0]
foam_threshold = 0.8149999976158142
foam_noise_scale = 0.5799999833106995
ramp_steps = 6.0
specular_strength = 1.0
band_wobble = 0.6000000238418579
band_dither = 0.10999999940395355
band_dither_scale = 16.0
turbidity = 0.800000011920929
refraction_strength = 0.6000000238418579
absorption_color = [0.9, 0.35, 0.22]
sky_reflection_strength = 0.44999998807907104
grid_scale = 60.0
fade_start = 90.0
fade_end = 170.0
splash_strength = 1.0
splash_width = 0.3499999940395355
splash_flicker_speed = 1.600000023841858
splash_noise_scale = 5.0
splash_baseline = 0.15000000596046448
splash_response = 1.0
# Bioluminescence (M8): color is a scene constant; strength is owned by
# biolum.rhai — zero except during rare night bloom windows.
foam_glow_color = [0.35, 0.95, 0.75, 1.0]
foam_glow = 0.0

# ── Wave probe: CPU/GPU parity check (bright buoy pinned to
#    ocean_height; if it detaches from the surface, parity broke) ──

[entities.wave_probe]
[entities.wave_probe.transform]
position = [4.0, 0.0, 6.0]
[entities.wave_probe.model]
asset = "buoy"
[entities.wave_probe.script]
source = "wave_probe.rhai"

# ── The raft ─────────────────────────────────────────────────────

[entities.raft]
[entities.raft.transform]
position = [0.0, 0.05, 0.0]
rotation = [0.0, 0.0, 0.0]
[entities.raft.model]
asset = "raft"
[entities.raft.raft_float]
heave_response = 3.0
angular_response = 3.5
normal_blend = 0.4
draft = 0.08
half_width = 1.0
half_length = 0.9
drift_speed = 0.25
drift_dir_deg = 25.0
yaw_sway_deg = 5.0
yaw_sway_rate = 0.05
[entities.raft.ocean_contact]
half_x = 1.2   # deck width 2.4 m (log ends)
half_z = 1.15  # log length 2.3 m
[entities.raft.script]
source = "raft.rhai"

# ── Audio: ocean bed + light wind, plus physics-driven laps/creaks ──

[entities.ocean_ambience]
[entities.ocean_ambience.audio_source]
file = "audio/ocean_loop.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.55

[entities.wind_ambience]
[entities.wind_ambience.audio_source]
file = "audio/wind_light.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.3

[entities.raft_audio]
[entities.raft_audio.script]
source = "raft_audio.rhai"

# ── Music (M7): four time-of-day beds crossfaded by music.rhai. The
#    engine has no play/stop script API, so sources must keep
#    autoplay = true and start at volume 0 — the script fades them. ──

[entities.music_day]
[entities.music_day.audio_source]
file = "audio/music_day.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

[entities.music_dusk]
[entities.music_dusk.audio_source]
file = "audio/music_dusk.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

[entities.music_night]
[entities.music_night.audio_source]
file = "audio/music_night.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

[entities.music_deep]
[entities.music_deep.audio_source]
file = "audio/music_deep.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

[entities.music_controller]
[entities.music_controller.music]
enabled = true
master_volume = 0.3
fade_seconds = 8.0
swell_seconds = 210.0
ebb_seconds = 150.0        # 0 = continuous music
swell_fade_seconds = 15.0
[entities.music_controller.script]
source = "music.rhai"

# ── The dusk whale (M8): parked far underwater until whale.rhai
#    schedules a breach against the sunset band ──────────────────────

[entities.whale]
[entities.whale.transform]
position = [0.0, -40.0, 130.0]
[entities.whale.model]
asset = "whale"
[entities.whale.whale]
enabled = true
distance = 130.0
bearing_deg = 278.0     # sunset azimuth (sun sets 272-285) — breach in the light
bearing_spread_deg = 30.0
window_start = 19.2
window_end = 20.6
breach_height = 6.0
breach_duration = 3.4
encore_chance = 0.35
[entities.whale.script]
source = "whale.rhai"

# Splash column at the breach point. The spray tint is baked dusk-warm:
# the emitter only ever fires inside the dusk window, so the constant
# IS the TOD-correct color (particles are unlit).

[entities.whale_splash]
[entities.whale_splash.transform]
position = [0.0, -40.0, 130.0]
[entities.whale_splash.particle_emitter]
emission_rate = 0.0
max_particles = 256
lifetime_min = 0.9
lifetime_max = 1.9
speed_min = 6.0
speed_max = 14.0
direction = [0.0, 1.0, 0.0]
spread = 55.0
gravity = [0.0, -9.81, 0.0]
damping = 0.4
size_start = 1.2
size_end = 0.25
color_start = [0.98, 0.86, 0.82, 0.9]
color_end = [0.75, 0.62, 0.68, 0.0]
shape = "cone"
shape_radius = 2.5
shape_angle = 50.0
world_space = true
autoplay = false

# ── Bioluminescent bloom nights (M8): biolum.rhai rolls the dice each
#    night; most nights nothing, some nights an hour or two of glowing
#    churn. It owns ocean.foam_glow. ──────────────────────────────────

[entities.biolum_controller]
[entities.biolum_controller.biolum]
enabled = true
chance = 0.4
earliest = 21.6
latest = 26.5           # hours >24 = after midnight (2:30)
duration_min = 0.8
duration_max = 2.0
fade_hours = 0.3
strength = 0.5
[entities.biolum_controller.script]
source = "biolum.rhai"

# ── Dawn birds (M8): five silhouettes in a loose V cross the sunrise
#    glow; birds.rhai schedules and flies them, parked deep otherwise ──

[entities.bird_flock]
[entities.bird_flock.birds]
enabled = true
distance = 110.0
height = 12.0
speed = 9.0
bearing_deg = 85.0      # sunrise azimuth — cross the glow
bearing_spread_deg = 25.0
window_start = 5.6
window_end = 7.2
crossing_length = 260.0
encore_chance = 0.4
[entities.bird_flock.script]
source = "birds.rhai"

[entities.bird_0]
[entities.bird_0.transform]
position = [0.0, -60.0, 0.0]
[entities.bird_0.model]
asset = "bird"

[entities.bird_1]
[entities.bird_1.transform]
position = [0.0, -60.0, 0.0]
[entities.bird_1.model]
asset = "bird"

[entities.bird_2]
[entities.bird_2.transform]
position = [0.0, -60.0, 0.0]
[entities.bird_2.model]
asset = "bird"

[entities.bird_3]
[entities.bird_3.transform]
position = [0.0, -60.0, 0.0]
[entities.bird_3.model]
asset = "bird"

[entities.bird_4]
[entities.bird_4.transform]
position = [0.0, -60.0, 0.0]
[entities.bird_4.model]
asset = "bird"

# ── Seated first-person camera (declared after the raft so it reads
#    this frame's raft transform) ─────────────────────────────────

[entities.seat_camera]
[entities.seat_camera.seat]
raft = "raft"
edge_offset_z = 1.05
half_x = 0.95          # scoot path stops shy of the log ends (deck half 1.2)
corner_radius = 0.3
scoot_speed = 0.4      # a shuffle, not a stride
scoot_ease = 5.0
eye_height = 0.55
deck_top = 0.26
roll_transfer = 0.45
mouse_sens = 0.0028
[entities.seat_camera.script]
source = "seat_camera.rhai"

# ── The player's legs, dangling over the deck edge into the water.
#    Declared AFTER seat_camera: legs_idle.rhai reads the scoot state
#    the seat script published THIS frame (seat_x/seat_z/seat_out_deg).
#    Swap models/legs.glb for a nicer model any time — same
#    origin/pose contract. ──

[entities.legs]
[entities.legs.transform]
position = [0.0, 0.3, 1.0]
[entities.legs.model]
asset = "legs"
[entities.legs.script]
source = "legs_idle.rhai"
