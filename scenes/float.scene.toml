# ── The Visitor: a weathered twin raft (raft2) drifts up around noon
#    of day 1 (the first counted day after the title's looping day 0),
#    holds ~18 m off, then drifts away. Parked deep until
#    raft_visitor.rhai drives it; rare return visits on later days. ──

[entities.raft2]
[entities.raft2.transform]
position = [-80.0, -50.0, -80.0]   # own parking spot: not whale [0,-40,130], not birds y=-60
[entities.raft2.model]
asset = "raft2"

[entities.raft_visitor]
[entities.raft_visitor.raft_visitor]
enabled = true
first_day = 1.0         # the first counted day (day 0 loops under the title)
window_start = 11.5
window_end = 13.0
return_chance = 0.15
bearing_deg = 60.0      # clear of the whale's 278° sunset band
bearing_spread_deg = 40.0
spawn_distance = 140.0  # beyond fog_start — it comes out of the haze
hold_distance = 18.0
approach_duration_s = 90.0
hold_duration_s = 150.0
depart_duration_s = 110.0
depart_turn_deg = 70.0
wander_amp_m = 2.0
draft = 0.10            # a touch lower than the player's 0.08 — waterlogged
heave_response = 2.6    # lazier than the player raft (3.0/3.5)
angular_response = 3.0
lap_volume = 0.25
lap_min_gap_s = 2.5
creak_volume = 0.18
trigger_visit = -1.0    # debug one-shot: set >= 0.5 to fire a visit now
debug_log = false
phase = 0.0             # published by the script — F3 Visitor panel status
day = 0.0               # published by the script — mirrors the tod day counter
[entities.raft_visitor.script]
source = "raft_visitor.rhai"

# ── Seated first-person camera (declared after the raft so it reads
#    this frame's raft transform) ─────────────────────────────────

[entities.seat_camera]
[entities.seat_camera.seat]
raft = "raft"
edge_offset_z = 1.05
half_x = 0.95          # scoot path stops shy of the log ends (deck half 1.2)
corner_radius = 0.3
scoot_speed = 0.4      # continuous-fallback slide speed
scoot_ease = 5.0
animated_scoot = true  # discrete body-driven steps (false = old slide)
step_time = 1.4        # MUST match the scoot clip length (generate_body.py)
step_distance = 0.35
step_pause = 0.18
step_bob = 0.06
eye_height = 0.55
eye_inboard = 0.10     # propped-on-hands lean-back; helps the knees reach the frame
eye_follow = 1.0       # camera rides the body's eye bone (0 = legacy fixed offset)
body_inset = 0.03      # shared with body.rhai — body origin inboard of the path
body_seat_y = 0.28     # shared with body.rhai — body origin above raft origin
deck_top = 0.26
roll_transfer = 0.45
mouse_sens = 0.0028
# Underwater moments (render mode 5) — every field the script reads must
# be listed here (schema defaults do NOT materialize; unit-read throws).
submerge_full_m = 0.15    # eye depth (m) where the published factor saturates
submerge_release_s = 0.12 # effect release after the swell clears the eye
force_submerge_s = 0.0    # DEBUG one-shot: >0 forces N seconds submerged
submerged = 0.0           # RUNTIME published factor (water_ambience, reality)
[entities.seat_camera.camera_tuning]
fov_deg = 75.0         # F3 Camera panel tunes this live. 75° + the ~10°-down
                       # resting gaze puts the raised knees just inside the
                       # bottom of the frame without rectilinear smear
[entities.seat_camera.script]
source = "seat_camera.rhai"

# ── The player's body: rigged and skinned (models/body.glb), legs
#    dangling over the deck edge, arms that plant and push during
#    scoots. Declared AFTER seat_camera: body.rhai reads the scoot
#    state the seat script published (seat_x/seat_z/seat_out_deg/
#    step_dir). Idle sway and the scoot sequence are skeletal clips
#    embedded in the GLB (tools/generate_body.py). ──

[entities.body]
[entities.body.transform]
position = [0.0, 0.28, 1.0]
[entities.body.model]
asset = "body"
[entities.body.skeleton]
skin = "body_rig"
[entities.body.bone_probe]
joint = "eye"      # seat_camera.rhai follows this joint (eye_follow)
[entities.body.animator]
clip = "idle_deck"     # default variant: propped lean-back matches the camera
layer_clip = "legs_rock"   # additive: the self-soothing knee rock, always on
layer_weight = 1.0
# These four MUST live under [animator] — they sat under [idle_brain] below,
# where TOML quietly assigned them to the wrong component. animator.playing
# and .autoplay both default to FALSE, so the base clip's time never advanced
# (skeletal_sync.rs only ticks state.time inside `if state.playing`). It went
# unnoticed because the legs_rock additive layer advances regardless, and
# because the old blend-target bug re-armed the crossfade forever — which
# replayed the first blend_duration of each clip on a loop and passed for
# animation. With that bug fixed, a wrong `playing` freezes the pose outright.
autoplay = true
loop = true
playing = true
speed = 1.0
[entities.body.idle_brain]
enabled = true
dwell_min = 12.0
dwell_max = 30.0
fidget_chance = 0.45
big_chance = 0.08      # the rare big stretch — keep infrequent
variant_blend = 2.0
fidget_blend = 0.5
[entities.body.script]
source = "body.rhai"

