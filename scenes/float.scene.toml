# ================================================================
#  FLOAT — set + drift
# ================================================================
#
#  You sit on a hand-lashed raft on an endless ocean. That's it.
#  That's the game.
#
#  Launch: play.bat
#
#  Controls:
#    Mouse / Arrows / Right stick — look around
#    Escape                       — exit
#
#  M0: static raft on a flat placeholder slab. The real ocean
#  arrives with the M1 ocean pipeline.
# ================================================================

[scene]
name = "Float — set + drift"
version = "0.1"
description = "First-person raft on an endless stylized ocean"
input_config = "config/input.toml"

[post_process]
enabled = true
bloom_enabled = true
bloom_intensity = 0.06
bloom_threshold = 1.0
vignette_enabled = true
vignette = 0.18
fog_enabled = true
fog_color = [0.70, 0.82, 0.92]
fog_density = 0.0015
fog_start = 60.0

# ── Light: late-morning sun (M3 animates this via time_of_day.rhai) ──

# Note: Flint's light `direction` points FROM surfaces TOWARD the light
# (shadow eye sits along +direction; PBR uses L = normalize(direction)).
# Direction/color/intensity are driven per-frame by time_of_day.rhai.
[entities.sun]
[entities.sun.light]
type = "directional"
direction = [0.35, 0.75, -0.45]
color = [1.0, 0.96, 0.86]
intensity = 1.5

# ── Procedural sky (replaces the texture skybox; sun disc follows the
#    sun light). Fields driven per-frame by time_of_day.rhai. ──────

[entities.sky_dome]
[entities.sky_dome.sky]
zenith_color = [0.10, 0.32, 0.70, 1.0]
horizon_color = [0.55, 0.75, 0.90, 1.0]
haze_color = [0.80, 0.88, 0.95, 0.55]
cloud_tint = [1.0, 1.0, 1.0, 0.85]
sun_disc_size = 0.035
sun_glow = 1.0
star_opacity = 0.0
cloud_coverage = 0.38
cloud_density = 0.22
cloud_scale = 0.9
cloud_drift_x = 0.004
cloud_drift_y = 0.0015

# ── Time of day: one continuous 0-24h parameter driving sun, sky,
#    fog, ambient, and the ocean palette ───────────────────────────

[entities.tod]
[entities.tod.time_of_day]
time_hours = 10.5
day_length_sec = 600.0
auto_advance = true
sun_path_tilt_deg = 28.0
day = 0.0               # day 0 = the title day: loops (no midnight advance)
last_hours = 10.5       #   while title.locked is up, then completes into day 1
# The opening days pass in a blur. Declared here so the F3 Day / Time panel
# reports the real length of the current day; time_of_day.rhai applies the
# same curve (keep them in sync — the script is the one that runs).
day_length_ramp = [0.1, 0.2, 0.4, 0.7, 1.0]   # 60/120/240/420/600 s at 600
[entities.tod.script]
source = "time_of_day.rhai"

# ── Weather: autonomous drifting states (clear → storm), wind → sea
#    cascade with real lag. Declared AFTER tod so it runs later the
#    same frame and composes over the light TOD just wrote. Set
#    enabled = false to hand-tune the ocean from the F3 panel. ──────

[entities.weather_controller]
[entities.weather_controller.weather]
enabled = true
forced_state = -1.0    # -1 = autonomous drift; 0..4 forces a state (F3 panel)
snap = false
strike_now = false
state = 1.0            # starting weather (SCATTERED = the old baseline)
wind = 4.0
sea = 0.25
fog_mul = 1.0
fog_gray = 0.0
sun_scale = 1.0
amb_scale = 1.0
star_scale = 1.0
tint_mul = 1.0
tint_alpha = 0.0
ocean_dark = 1.0
flash = 0.0
transition_s = 60.0
wind_tau_s = 20.0
sea_build_tau_s = 120.0
sea_decay_tau_s = 240.0
gust_strength = 0.15
amp_storm = 5.5
rain_rate_max = 4000.0
strike_min_s = 6.0
strike_max_s = 25.0
near_strike_chance = 0.2
raft_assist = 1.0
debug_log = false
[entities.weather_controller.script]
source = "weather.rhai"

# ── Reality tears: rare render-mode world events (reality.rhai). The
#    world's skin splits and another view bleeds through — waves as falling
#    code at night, a blood sea at dusk, a drunk lean, a Tron wire-world.
#    Autonomous scheduling with per-mode hour affinities; storm-shy; the F3
#    Reality panel forces/ends tears and pins the mix for tuning. ──────────

[entities.reality_controller]
[entities.reality_controller.reality]
enabled = true
min_interval_s = 480.0   # 8-20 real minutes between tears
max_interval_s = 1200.0
duration_min_s = 20.0
duration_max_s = 45.0
ease_in_s = 2.5
ease_out_s = 3.5
w_matrix = 1.0
w_blood = 1.0
w_drunk = 1.0
w_tron = 1.0
hour_center_matrix = 23.0  # deep night — code against the stars
hour_width_matrix = 3.0
hour_center_blood = 19.0   # the sunset band
hour_width_blood = 1.5
hour_center_drunk = 0.0    # width 0 = hour-blind
hour_width_drunk = 0.0
hour_center_tron = 22.0    # late night
hour_width_tron = 3.0
mask_scale = 3.0
mask_style = 0.0           # fbm patches (1 = radial iris)
trigger_mode = -1.0        # one-shots + debug (F3 panel writes these)
end_now = false
mix_override = -1.0
active_mode = 0.0          # PUBLISHED (script-owned)
mix = 0.0
next_in_s = -1.0
lowpass_scale = 1.0
debug_log = false
[entities.reality_controller.script]
source = "reality.rhai"

# ── Dead calm (dead_calm.rhai): rare pre-dawn event — the sea collapses to
#    near-glass for ~4 game hours, wind and soundscape die with it, the
#    water mirrors the stars. Publishes sea/wind/bed factors that
#    weather.rhai and water_ambience.rhai apply at their own write sites. ──

[entities.dead_calm_controller]
[entities.dead_calm_controller.dead_calm]
enabled = true
min_interval_s = 900.0     # attempts every 15-30 real min (~2-3 game days)
max_interval_s = 1800.0
retry_s = 60.0
hour_center = 3.0          # pre-dawn — a black mirror under the stars
hour_width = 3.0
max_weather_state = 1.2    # only falls out of a near-clear sky
min_day = 2.0              # learn the ocean's breathing before its absence
ease_in_s = 8.0            # unnaturally fast collapse — that's the eeriness
hold_hours = 4.0
ease_out_s = 30.0          # life returns gradually
trough_amp_frac = 0.03     # ~3 cm faint breath on a clear-state 1.1 m sea
trough_wind_frac = 0.15
trough_bed = 0.06
calm_splash_baseline = 0.0 # no contact-foam ring on glass
calm_splash_strength = 0.15
calm_sky_reflection = 0.85 # the mirror reads
trigger_calm = -1.0        # one-shots (F3 panel writes these)
end_now = false
calm = 0.0                 # PUBLISHED (script-owned)
sea_scale = 1.0
wind_scale = 1.0
bed_scale = 1.0
phase = 0.0
next_in_s = -1.0
debug_log = false
[entities.dead_calm_controller.script]
source = "dead_calm.rhai"

# ── Opening title card (title.rhai): SET + DRIFT / PRESS ANY KEY over the
#    living world. Look/scoot input stays locked (seat_camera.rhai reads
#    the published `locked` factor) until the first keypress fades the
#    card out. Sprites regenerate via tools/generate_title.py. ───────────

[entities.title_controller]
[entities.title_controller.title]
enabled = true
min_show_s = 0.75
fade_in_s = 2.5
sub_delay_s = 1.6
fade_out_s = 2.2
title_frac = 0.60      # 11 glyphs vs ADRIFT's 6 — wider card, same weight
locked = 1.0           # PUBLISHED (script-owned): 0 the moment a key lands
[entities.title_controller.script]
source = "title.rhai"

# Rain: a camera-following box emitter 9 m overhead (weather.rhai
# repositions it every frame, slants the fall with the wind via the
# live-mutable gravity field, and scales emission with the state).
# Budget: 4000/s x 1.2 s life ~ 4800 alive, under the 6000 cap.
# Colors are dimmed live to match the light — unlit particles would
# otherwise glow at night.

[entities.rain_emitter]
[entities.rain_emitter.transform]
position = [0.0, 9.0, 0.0]
[entities.rain_emitter.particle_emitter]
emission_rate = 0.0
max_particles = 6000
lifetime_min = 1.0
lifetime_max = 1.2
speed_min = 10.0
speed_max = 14.0
direction = [0.0, -1.0, 0.0]
spread = 3.0
gravity = [0.0, -2.0, 0.0]
damping = 0.0
size_start = 0.035
size_end = 0.03
color_start = [0.70, 0.78, 0.88, 0.5]
color_end = [0.60, 0.68, 0.80, 0.25]
texture = "textures/rain_drop.png"
stretch = 0.035          # ~0.4-0.5 m streaks at terminal fall speed
shape = "box"
shape_extents = [7.0, 0.5, 7.0]
world_space = true
autoplay = true

# Weather audio beds: volume-faded by weather.rhai (component sources
# have no play/stop — autoplay at 0 and fade, like the music beds).

[entities.rain_ambience]
[entities.rain_ambience.audio_source]
file = "audio/rain_loop.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

[entities.storm_howl]
[entities.storm_howl.audio_source]
file = "audio/storm_howl.ogg"
loop = true
autoplay = true
spatial = false
volume = 0.0

# ── The ocean ────────────────────────────────────────────────────

[entities.ocean]
[entities.ocean.ocean]
seed = 7
# 16 waves across 5-110 m: long-wave headroom for storm swell. At calm
# winds JONSWAP puts near-zero energy in the long bins (weather.rhai
# ramps wind_speed/fetch_km to move energy there during storms).
num_waves = 16
wavelength_min = 5.0
wavelength_max = 110.0
amplitude = 2.0
choppiness = 0.8199999928474426
direction_deg = 155.0
spread_deg = 40.0
speed_scale = 1.0
wind_speed = 4.0
fetch_km = 60.0
peak_enhancement = 3.299999952316284
deep_color = [0.01600000075995922, 0.14000000059604645, 0.5, 1.0]
shallow_color = [0.10000000149011612, 0.46000000834465027, 0.8500000238418579, 1.0]
foam_color = [0.9700000286102295, 0.9900000095367432, 1.0, 1.0]
sss_color = [0.05000000074505806, 0.44999998807907104, 0.5, 1.0]
foam_threshold = 0.8149999976158142
foam_noise_scale = 0.5799999833106995
ramp_steps = 6.0
specular_strength = 1.0
band_wobble = 0.6000000238418579
band_dither = 0.10999999940395355
band_dither_scale = 16.0
turbidity = 0.800000011920929
refraction_strength = 0.6000000238418579
absorption_color = [0.9, 0.35, 0.22]
sky_reflection_strength = 0.44999998807907104
grid_scale = 60.0
fade_start = 90.0
fade_end = 170.0
splash_strength = 1.0
splash_width = 0.3499999940395355
splash_flicker_speed = 1.600000023841858
splash_noise_scale = 5.0
splash_baseline = 0.15000000596046448
splash_response = 1.0
# Bioluminescence (M8): color is a scene constant; strength is owned by
# biolum.rhai — zero except during rare night bloom windows.
foam_glow_color = [0.35, 0.95, 0.75, 1.0]
foam_glow = 0.0
rain_ripple = 0.0       # impact rings; weather.rhai drives it with the rain
show_probe = false      # parity buoy; toggle in F3 Ocean Debug → Diagnostics

# ── Wave probe: CPU/GPU parity check (bright buoy pinned to
#    ocean_height; if it detaches from the surface, parity broke).
#    Off by default — toggled by ocean.show_probe (F3 Ocean Debug →
#    Diagnostics); spawns parked underwater so it never flashes on
#    the first frame. ──

[entities.wave_probe]
[entities.wave_probe.transform]
position = [0.0, -60.0, 0.0]
[entities.wave_probe.model]
asset = "buoy"
[entities.wave_probe.script]
source = "wave_probe.rhai"

# ── The raft ─────────────────────────────────────────────────────

[entities.raft]
[entities.raft.transform]
