version = 1
game_id = "float"

# ── Look: arrow keys + gamepad right stick ──────────────────────────────
# Mouse look reads mouse_delta_x()/mouse_delta_y() directly in
# seat_camera.rhai once cursor capture lands (M2, set_cursor_captured).
# These bindings are the M0 fallback and remain as gamepad support.

[actions.look_x]
kind = "axis1d"
[[actions.look_x.bindings]]
type = "key"
code = "ArrowLeft"
scale = -1.0
[[actions.look_x.bindings]]
type = "key"
code = "ArrowRight"
scale = 1.0
[[actions.look_x.bindings]]
type = "gamepad_axis"
axis = "RightStickX"
gamepad = "any"
deadzone = 0.15
scale = 1.0

[actions.look_y]
kind = "axis1d"
[[actions.look_y.bindings]]
type = "key"
code = "ArrowUp"
scale = -1.0
[[actions.look_y.bindings]]
type = "key"
code = "ArrowDown"
scale = 1.0
[[actions.look_y.bindings]]
type = "gamepad_axis"
axis = "RightStickY"
gamepad = "any"
deadzone = 0.15
scale = -1.0    # gilrs stick-up is +1; the seat script subtracts (look up)

# ── Scoot along the raft edge (M6): A/D or left stick ──────────────────
# Positive = screen-left (facing outward, increasing engine yaw turns
# toward +X = screen-LEFT, so A is +1 and stick-right is inverted).

[actions.scoot]
kind = "axis1d"
[[actions.scoot.bindings]]
type = "key"
code = "KeyA"
scale = 1.0
[[actions.scoot.bindings]]
type = "key"
code = "KeyD"
scale = -1.0
[[actions.scoot.bindings]]
type = "gamepad_axis"
axis = "LeftStickX"
gamepad = "any"
deadzone = 0.15
scale = -1.0

# ── Recapture mouse after Escape released it ────────────────────────────

[actions.recapture]
kind = "button"
[[actions.recapture.bindings]]
type = "mouse_button"
button = "Left"

# ── Debug ───────────────────────────────────────────────────────────────

[actions.toggle_debug]
kind = "button"
[[actions.toggle_debug.bindings]]
type = "key"
code = "F1"

# ── On a phone (Flint#133, #134): drag to look, two buttons to scoot ────
# Kept to the least that plays it: no stick and no menu. The whole screen
# is the look region, and a drag turns the view as the mouse does (a
# finger's travel in points times `sensitivity` counts, at mouse_sens rad
# per count: a swipe across a phone is a little over a quarter turn). Each
# button drives the scoot axis from its own end, as A and D do.

[touch_controls]
opacity = 0.75

[[touch_controls.buttons]]
action = "scoot"
value = 1.0
label = "◀"
anchor = "bottom_left"
offset = [64, 64]
radius = 30

[[touch_controls.buttons]]
action = "scoot"
value = -1.0
label = "▶"
anchor = "bottom_right"
offset = [64, 64]
radius = 30

[touch_controls.look]
region = [0.0, 0.0, 1.0, 1.0]
sensitivity = 0.7
